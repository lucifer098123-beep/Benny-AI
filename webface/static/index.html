<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>benny</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<div id="app">
  <header id="topbar">
    <div class="brand">
      <div class="orb" id="orb" role="img" aria-label="benny is breathing"></div>
      <div class="brandtxt">
        <span class="name">benny</span>
        <span class="version" id="version">webface 0.1</span>
      </div>
    </div>
    <div class="meta">
      <span class="badge" id="level-badge">novice</span>
      <span class="chip" id="mem-chip">mem 0</span>
      <span class="chip" id="lat-chip"></span>
    </div>
  </header>

  <main id="chat">
    <div class="msg benny">
      <div class="bubble">secure · private · all-local.
now with eyes — attach an image or gif and i'll describe it.</div>
    </div>
  </main>

  <footer id="inputbar">
    <button id="attach" title="send benny an image">📎</button>
    <input id="entry" type="text" placeholder="talk to benny, or attach an image / gif…" autocomplete="off" spellcheck="false">
    <button id="send" title="send">↵</button>
    <input id="file" type="file" accept="image/*,.gif" hidden>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
